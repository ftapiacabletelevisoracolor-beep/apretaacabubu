<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apretá acá bubu 🤍</title>
<meta property="og:title" content="Apretá acá bubu 🤍">
<meta property="og:description" content="Tengo algo para vos. Abrilo con auriculares 🎧">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#1C2146;
    --noche-2:#2E2A5C;
    --rosa:#EBB7C0;
    --rosa-fuerte:#D9738A;
    --oro:#F3CD7A;
    --papel:#FFF8F4;
    --tinta:#3A2E3F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--papel);
    background:radial-gradient(ellipse at 50% 0%, var(--noche-2) 0%, var(--noche) 70%);
    background-attachment:fixed;
    min-height:100%;
    padding:env(safe-area-inset-top,0) 20px env(safe-area-inset-bottom,0);
    overflow-x:hidden;
  }
  .estrellas{position:fixed;inset:0;pointer-events:none;z-index:0}
  .estrellas span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6;animation:titila 3s ease-in-out infinite}
  @keyframes titila{50%{opacity:.15}}

  main{position:relative;z-index:1;max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0}

  /* ---------- Sobre ---------- */
  #inicio{text-align:center;transition:opacity .6s, transform .6s}
  #inicio.oculto{opacity:0;transform:scale(.9);pointer-events:none;position:absolute}
  .sobre{
    width:260px;height:170px;margin:0 auto 34px;position:relative;
    background:var(--rosa);border-radius:6px;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
  }
  .sobre::before{ /* solapa */
    content:"";position:absolute;left:0;top:0;width:0;height:0;
    border-left:130px solid transparent;border-right:130px solid transparent;
    border-top:95px solid #E3A3AF;
    transform-origin:top;transition:transform .7s ease;
  }
  .sobre::after{ /* pliegues */
    content:"";position:absolute;left:0;bottom:0;width:0;height:0;
    border-left:130px solid #F2C6CD;border-right:130px solid #F2C6CD;
    border-top:85px solid transparent;border-radius:0 0 6px 6px;
  }
  .sello{
    position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:2;
    width:48px;height:48px;border-radius:50%;background:var(--rosa-fuerte);
    display:grid;place-items:center;font-size:22px;color:var(--papel);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);
    animation:late 1.6s ease-in-out infinite;
  }
  @keyframes late{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
  #inicio h1{font-family:'Caveat',cursive;font-weight:700;font-size:44px;line-height:1.1;margin-bottom:10px}
  #inicio p{opacity:.8;margin-bottom:28px}
  button{
    font:inherit;font-weight:600;font-size:17px;
    background:var(--oro);color:var(--tinta);border:0;border-radius:999px;
    padding:14px 34px;cursor:pointer;
    box-shadow:0 8px 20px rgba(243,205,122,.3);
    transition:transform .15s;
  }
  button:active{transform:scale(.96)}
  button:focus-visible{outline:3px solid var(--papel);outline-offset:3px}

  /* ---------- Carta ---------- */
  #carta{display:none;width:100%;text-align:center}
  #carta.visible{display:block}
  .polaroid{
    background:var(--papel);padding:12px 12px 16px;border-radius:4px;
    width:min(300px,85vw);margin:0 auto;
    box-shadow:0 24px 50px rgba(0,0,0,.45);
    transform:rotate(-3deg) translateY(40px);opacity:0;
    animation:sube 1s .1s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes sube{to{transform:rotate(-3deg) translateY(0);opacity:1}}
  .polaroid img{width:100%;height:auto;display:block;border-radius:2px;background:var(--rosa)}
  .polaroid .sin-foto{width:100%;aspect-ratio:4/5;display:none;place-items:center;font-size:80px;background:var(--rosa);border-radius:2px}
  .polaroid figcaption{font-family:'Caveat',cursive;font-size:24px;color:var(--tinta);margin-top:10px}

  .texto{opacity:0;animation:aparece 1s 1s forwards;text-shadow:0 2px 8px rgba(28,33,70,.9),0 0 2px rgba(28,33,70,.9)}
  @keyframes aparece{to{opacity:1}}
  #carta h2{font-family:'Caveat',cursive;font-weight:700;font-size:46px;line-height:1.05;margin:34px 0 14px;color:var(--rosa)}
  .mensaje{font-size:17px;line-height:1.65;max-width:34ch;margin:0 auto;white-space:pre-line}
  .firma{font-family:'Caveat',cursive;font-size:28px;margin-top:18px;color:var(--oro)}

  .reproductor{
    margin:34px auto 0;width:100%;max-width:360px;
    background:rgba(255,255,255,.08);border-radius:14px;padding:10px;
    opacity:0;animation:aparece 1s 1.6s forwards;
  }
  .reproductor .video{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
  .reproductor .video > *{position:absolute;inset:0;width:100%;height:100%}
  .reproductor small{display:block;margin-top:8px;opacity:.75;font-size:13px}


  .flotantes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .flotantes img{
    position:absolute;bottom:-160px;width:var(--t,90px);height:auto;
    border:4px solid var(--papel);border-radius:12px;
    box-shadow:0 10px 24px rgba(0,0,0,.35);opacity:.6;
    animation:deriva var(--d,22s) linear infinite;animation-delay:var(--r,0s);
  }
  @keyframes deriva{
    0%{transform:translateY(0) rotate(var(--g1,-8deg))}
    50%{transform:translateY(-60vh) translateX(var(--x,20px)) rotate(var(--g2,8deg))}
    100%{transform:translateY(calc(-100vh - 200px)) rotate(var(--g1,-8deg))}
  }
  .corazones{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
  .corazones i{position:absolute;bottom:-40px;font-style:normal;animation:flota linear forwards}
  @keyframes flota{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .flotantes img{bottom:auto;top:var(--y,50%);transform:rotate(var(--g1,-6deg))}
    *,*::before,*::after{animation:none!important;transition:none!important}
    .polaroid{opacity:1;transform:rotate(-3deg)}
    .texto,.reproductor{opacity:1}
  }
</style>
</head>
<body>
<div class="estrellas" id="estrellas"></div>
<div class="flotantes" id="flotantes"></div>
<div class="corazones" id="corazones"></div>

<main>
  <section id="inicio">
    <div class="sobre"><div class="sello">♥</div></div>
    <h1 id="tituloInicio"></h1>
    <p id="subInicio"></p>
    <button id="abrir">Abrir</button>
  </section>

  <section id="carta" aria-live="polite">
    <figure class="polaroid">
      <img id="foto" alt="Nosotros">
      <div class="sin-foto" id="sinFoto">🤍</div>
      <figcaption id="pie"></figcaption>
    </figure>

    <div class="texto">
      <h2 id="titulo"></h2>
      <p class="mensaje" id="mensaje"></p>
      <p class="firma" id="firma"></p>
    </div>

    <div class="reproductor">
      <div class="video"><div id="player"></div></div>
      <small id="cancionTxt"></small>
      <a id="respaldo" target="_blank" rel="noopener"
         style="display:none;margin-top:12px;background:var(--oro);color:var(--tinta);text-decoration:none;font-weight:600;padding:10px 22px;border-radius:999px">
         ▶ Escuchar la canción</a>
    </div>
  </section>
</main>

  im.style.setProperty("--t", (70 + Math.random() * 35) + "px");
  im.style.setProperty("--d", (18 + Math.random() * 10) + "s");
  im.style.setProperty("--r", (-Math.random() * 25) + "s");
  im.style.setProperty("--y", (5 + ((i * 37) % 85)) + "%");
  im.style.setProperty("--x", (Math.random() * 60 - 30) + "px");
  im.style.setProperty("--g1", (Math.random() * 16 - 8) + "deg");

// YouTube
let player, listo = false, quiereSonar = false;
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
function onYouTubeIframeAPIReady(){
  player = new YT.Player("player", {
    videoId: CONFIG.youtubeId,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: { onReady: () => { listo = true; if (quiereSonar) sonar(); } }
  });
}
function sonar(){
  try { player.unMute(); player.setVolume(100); player.playVideo(); } catch(e){}
}

// lluvia de corazones
function corazones(){
  const emojis = ["🤍","💗","💕","♥"];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement("i");
    c.textContent = emojis[i % emojis.length];
    c.style.left = Math.random()*100 + "%";
    c.style.fontSize = (16 + Math.random()*22) + "px";
    c.style.animationDuration = (4 + Math.random()*4) + "s";
    c.style.animationDelay = (Math.random()*1.5) + "s";
    $("corazones").appendChild(c);
    setTimeout(() => c.remove(), 10000);
  }
}

$("abrir").addEventListener("click", () => {
  document.querySelector(".sobre").style.setProperty("--x","1");
  $("inicio").classList.add("oculto");
  setTimeout(() => {
    $("carta").classList.add("visible");
    window.scrollTo({top:0});
  }, 450);
  corazones();
  quiereSonar = true;
  if (listo) sonar();
  // si a los 5 segundos no está sonando, mostramos el botón de respaldo
  setTimeout(() => {
    let sonando = false;
    try { sonando = player && player.getPlayerState() === 1; } catch(e){}
    if (!sonando) $("respaldo").style.display = "inline-block";
  }, 5000);
});
$("respaldo").href = "https://youtu.be/" + CONFIG.youtubeId;
</script>
